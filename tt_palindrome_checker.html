<!DOCTYPE html>
<html>
	<head>
		<title>Palindrome Checker</title>

		<style>
			body
			{
				font-size: 16px;
				font-family: Verdana;
			}

			#pnlString
			{
				width: 800px;
				margin: 50px auto 0 auto;
				text-align: center;
			}

			#txtString
			{
				display: inline-block;
				width: 20em;
				height: 1.5em;
				font-size: 2em;
				font-face: "Courier New", monospace;
				text-align: center;
				border-radius: 10px;
				border: 4px solid rgb(200, 200, 200);
			}

			#pnlOutput
			{
				width: 800px;
				height: auto;
				margin: 10px auto 0 auto;
				text-align: center;
				border: 3px dotted rgb(100, 100, 100);
				border-radius: 30px;
			}

			#pnlResult
			{
				width: 100%;
				height: 1.5em;
				font-size: 2.5em;
				font-face: Georgia;
				text-align: center;
				color: rgb(100, 100, 100);
			}

			#pnlVerification
			{
				width: 100%;
				height: 1.5em;
				text-align: center;
			}

			#pnlOptions
			{
				width: 800px;
				margin: 0 auto 0 auto;
				text-align: center;
			}

			label
			{
				font-weight: bold;
			}
		</style>

		<script>
			function checkPalindrome()
			{
				let txtString = document.getElementById("txtString");
				let processed = txtString.value.replace(/[^a-zA-Z]/g, "");
				let cbIgnoreCase = document.getElementById("cbIgnoreCase");

				if (cbIgnoreCase.checked) processed = processed.toLowerCase();
				setResult(processed);

				if (processed.length <= 1)
				{
					setVerification("Inconclusive...", "pending");
				}
				else
				{
					if (isPalindrome(processed))
					{
						setVerification("This is a Palindrome!", "success");
					}
					else
					{
						setVerification("This is not a Palindrome!", "failure");
					}
				}

				if (processed.length == 0)
				{
					setResult("(no text yet)");
					setVerification("Enter some text above", "default");
				}

				return;
			}

			function isPalindrome(str)
			{
				let arr = [...str];
				return (arr.reverse().join("") == str);
			}

			function setResult(str)
			{
				document.getElementById("pnlResult").innerHTML = str;

				return;
			}

			function setVerification(str, colorCode = "default")
			{
				let colors = 
				{
					"default": "black",
					"success": "green",
					"failure": "red",
					"pending": "grey"
				};

				let pnlVerification = document.getElementById("pnlVerification");
				pnlVerification.style.color = colors[colorCode];
				pnlVerification.innerHTML = str;

				return;
			}
		</script>
	</head>

	<body>
		<div id="pnlString">
			<input id="txtString" oninput="checkPalindrome();" placeholder="Enter text, e.g, Kayak" />
		</div>

		<div id="pnlOptions">
			<label><input type="checkbox" id="cbIgnoreCase" onclick="checkPalindrome();">Ignore Case</label>	
		</div>

		<div id="pnlOutput">
			<div id="pnlResult">(no text yet)</div>
			<div id="pnlVerification">Enter some text above</div>			
		</div>
	</body>
</html>
